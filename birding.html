  <!-- Full-screen photo viewer -->
  <div class="photo-lightbox" id="photoLightbox" aria-hidden="true">

  <!-- EXIF reader must load before the gallery script -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const photos = [
        {
          file: "images/birding01.jpg",
          title: "Bird Photograph 1",
          description: "Grey heron."
        },
        {
          file: "images/birding02.jpg",
          title: "Bird Photograph 2",
          description: "Grey heron."
        },
        {
          file: "images/birding03.jpg",
          title: "Bird Photograph 3",
          description: "Grey heron."
        }
      ];

      const gallery = document.getElementById("photoGallery");
      const viewer = document.getElementById("photoLightbox");
      const viewerImage = document.getElementById("lightboxImage");
      const title = document.getElementById("photoTitle");
      const description = document.getElementById("photoDescription");
      const details = document.getElementById("exifDetails");

      const closeButton = document.getElementById("lightboxClose");
      const previousButton = document.getElementById("lightboxPrev");
      const nextButton = document.getElementById("lightboxNext");

      let currentIndex = 0;
      let requestId = 0;

      // Generate the gallery from the photo list.
      photos.forEach(function (photo, index) {
        const figure = document.createElement("figure");
        figure.className = "photo-card";

        const link = document.createElement("a");
        link.href = photo.file;
        link.className = "photo-link";
        link.dataset.index = index;
        link.dataset.description = photo.description;
        link.setAttribute("aria-label", "Open " + photo.title);

        const img = document.createElement("img");
        img.src = photo.file;
        img.alt = photo.title;
        img.loading = "lazy";
        img.decoding = "async";

        const caption = document.createElement("figcaption");
        caption.className = "photo-caption";
        caption.textContent = photo.description;

        link.appendChild(img);
        figure.appendChild(link);
        figure.appendChild(caption);
        gallery.appendChild(figure);
      });

      const links = Array.from(
        gallery.querySelectorAll(".photo-link")
      );

      function addRow(label, value) {
        if (
          value === undefined ||
          value === null ||
          value === "" ||
          value === "undefined"
        ) {
          return;
        }

        const row = document.createElement("div");
        row.className = "exif-row";

        const labelElement = document.createElement("strong");
        labelElement.textContent = label + ": ";

        const valueElement = document.createElement("span");

        if (typeof value === "object" && value.numerator !== undefined) {
          const denominator = value.denominator || 1;
          valueElement.textContent = value.numerator / denominator;
        } else if (typeof value === "object") {
          valueElement.textContent = String(value);
        } else {
          valueElement.textContent = value;
        }

        row.appendChild(labelElement);
        row.appendChild(valueElement);
        details.appendChild(row);
      }

      function formatRational(value) {
        if (value && typeof value === "object" &&
            value.numerator !== undefined) {
          return value.numerator / (value.denominator || 1);
        }

        return value;
      }

      function renderExif(image, id) {
        if (id !== requestId) return;

        details.replaceChildren();

        addRow(
          "Dimensions",
          image.naturalWidth + " × " + image.naturalHeight + " px"
        );

        if (typeof EXIF === "undefined") {
          addRow("Metadata", "EXIF reader unavailable");
          return;
        }

        try {
          EXIF.getData(image, function () {
            if (id !== requestId) return;

            const get = tag => EXIF.getTag(this, tag);

            addRow("Camera", get("Model"));
            addRow("Lens", get("LensModel"));

            const iso = get("ISOSpeedRatings");
            addRow("ISO", Array.isArray(iso) ? iso.join(", ") : iso);

            const aperture = formatRational(get("FNumber"));
            if (aperture != null) {
              addRow("Aperture", "f/" + aperture);
            }

            const exposure = formatRational(get("ExposureTime"));
            if (exposure != null) {
              const seconds = Number(exposure);

              const shutter = seconds > 0 && seconds < 1
                ? "1/" + Math.round(1 / seconds) + " s"
                : seconds + " s";

              addRow("Shutter speed", shutter);
            }

            const focal = formatRational(get("FocalLength"));
            if (focal != null) {
              addRow("Focal length", focal + " mm");
            }

            addRow("Date taken", get("DateTimeOriginal"));
            addRow("Exposure compensation", get("ExposureBias"));

            if (details.children.length === 1) {
              addRow("Metadata", "No EXIF camera data found");
            }
          });
        } catch (error) {
          if (id === requestId) {
            addRow("Metadata", "Could not read EXIF data");
          }
        }
      }

      function openPhoto(index) {
        currentIndex = (index + photos.length) % photos.length;

        const photo = photos[currentIndex];
        const id = ++requestId;

        title.textContent = photo.title;
        description.textContent = photo.description;
        details.replaceChildren();

        viewer.classList.add("is-open");
        viewer.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";

        viewerImage.alt = photo.title;
        viewerImage.src = photo.file;

        const metadataImage = new Image();

        metadataImage.onload = function () {
          if (id !== requestId) return;
          renderExif(metadataImage, id);
        };

        metadataImage.onerror = function () {
          if (id !== requestId) return;
          details.replaceChildren();
          addRow("Metadata", "Could not load image metadata");
        };

        metadataImage.src = photo.file;
      }

      function closePhoto() {
        requestId++;
        viewer.classList.remove("is-open");
        viewer.setAttribute("aria-hidden", "true");
        viewerImage.src = "";
        document.body.style.overflow = "";
      }

      links.forEach(function (link, index) {
        link.addEventListener("click", function (event) {
          event.preventDefault();
          openPhoto(index);
        });
      });

      closeButton.addEventListener("click", closePhoto);

      previousButton.addEventListener("click", function (event) {
        event.stopPropagation();
        openPhoto(currentIndex - 1);
      });

      nextButton.addEventListener("click", function (event) {
        event.stopPropagation();
        openPhoto(currentIndex + 1);
      });

      viewer.addEventListener("click", function (event) {
        if (event.target === viewer) {
          closePhoto();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (!viewer.classList.contains("is-open")) return;

        if (event.key === "Escape") {
          closePhoto();
        } else if (event.key === "ArrowLeft") {
          openPhoto(currentIndex - 1);
        } else if (event.key === "ArrowRight") {
          openPhoto(currentIndex + 1);
        }
      });
    });
  </script>
