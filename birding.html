    .photo-gallery {

    /* Full-screen photo viewer */
    .photo-lightbox {

      position: fixed !important;
      inset: 0 !important;

      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: 55px 65px 25px;
      background: rgba(0, 0, 0, 0.96);
      overflow: auto;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
    }

    .photo-lightbox.is-open {
      display: flex !important;
    }

    .lightbox-content {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .lightbox-image-wrap {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #lightboxImage {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.35);
    }

    .photo-info {
      flex: 0 0 260px;
      max-width: 260px;
      max-height: 100%;
      overflow-y: auto;
      color: #eee;
      font-family: Roboto, sans-serif;
      overflow-wrap: anywhere;
    }

    .photo-info h3 {
      font-size: 21px;
      line-height: 1.4;
      color: white;
      margin: 0 0 12px;
    }

    .photo-info p {
      font-size: 14px;
      line-height: 1.6;
      color: #ccc;
      margin-bottom: 18px;
    }

    #exifDetails {
      font-size: 13px;
      color: #ccc;
    }

    .exif-row {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,.15);
      line-height: 1.45;
    }

    .exif-row strong {
      color: #fff;
    }

    .lightbox-close,
    .lightbox-nav {
      position: absolute;
      z-index: 2;
      border: 0;
      color: white;
      background: rgba(40, 40, 40, 0.75);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .lightbox-close {
      top: 12px;
      right: 22px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 34px;
    }

    .lightbox-nav {
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 58px;
      border-radius: 5px;
      font-size: 27px;
    }

    .lightbox-prev {
      left: 10px;
    }

    .lightbox-next {
      right: 10px;
    }

    .lightbox-close:hover,
    .lightbox-nav:hover {
      background: rgba(110, 110, 110, 0.9);
    }

    body.lightbox-open {
      overflow: hidden !important;
    }

    @media (max-width: 800px) {
      .photo-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .photo-lightbox {
        padding: 55px 45px 20px;
      }

      .lightbox-content {
        flex-direction: column;
        gap: 14px;
      }

      .lightbox-image-wrap {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
      }

      .photo-info {
        flex: 0 0 auto;
        width: 100%;
        max-width: 600px;
        max-height: 30%;
      }

      .photo-info h3 {
        font-size: 18px;
        margin-bottom: 5px;
      }

      .photo-info p {
        margin-bottom: 8px;
      }

      .exif-row {
        display: inline-block;
        margin-right: 12px;
        border: 0;
      }

      .lightbox-prev {
        left: 3px;
      }

      .lightbox-next {
        right: 3px;
      }
    }

    @media (max-width: 480px) {
      .photo-gallery {
        grid-template-columns: 1fr;
      }

      .photo-lightbox {
        padding: 48px 35px 15px;
      }

      .lightbox-close {
        top: 5px;
        right: 8px;
      }

      .lightbox-nav {
        width: 32px;
        height: 45px;
        font-size: 21px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const links = Array.from(document.querySelectorAll(".photo-gallery .photo-link"));
      const viewer = document.getElementById("photoLightbox");
      const viewerImage = document.getElementById("lightboxImage");
      const title = document.getElementById("photoTitle");
      const description = document.getElementById("photoDescription");
      const details = document.getElementById("exifDetails");

      if (!links.length || !viewer || !viewerImage) return;

      let currentIndex = 0;
      let requestId = 0;

      function addRow(label, value) {
        if (value === undefined || value === null || value === "") return;

        const row = document.createElement("div");
        row.className = "exif-row";

        const labelElement = document.createElement("strong");
        labelElement.textContent = label + ": ";

        const valueElement = document.createElement("span");

        if (typeof value === "object" && value.numerator !== undefined) {
          valueElement.textContent =
            value.numerator / (value.denominator || 1);
        } else {
          valueElement.textContent = String(value);
        }

        row.append(labelElement, valueElement);
        details.appendChild(row);
      }

      function rationalValue(value) {
        if (value && typeof value === "object" && value.numerator !== undefined) {
          return value.numerator / (value.denominator || 1);
        }
        return value;
      }

      function renderExif(image, id) {
        if (id !== requestId) return;

        details.replaceChildren();
        addRow("Dimensions", image.naturalWidth + " × " + image.naturalHeight + " px");

        if (typeof EXIF === "undefined") {
          addRow("Metadata", "EXIF reader unavailable");
          return;
        }

        try {
          EXIF.getData(image, function () {
            if (id !== requestId) return;

            const get = tag => EXIF.getTag(this, tag);

            addRow("Camera", get("Model"));
            addRow("Lens", get("LensModel"));

            const iso = get("ISOSpeedRatings");
            addRow("ISO", Array.isArray(iso) ? iso.join(", ") : iso);

            const aperture = rationalValue(get("FNumber"));
            if (aperture != null) addRow("Aperture", "f/" + aperture);

            const exposure = rationalValue(get("ExposureTime"));
            if (exposure != null) {
              const seconds = Number(exposure);
              const shutter = seconds > 0 && seconds < 1
                ? "1/" + Math.round(1 / seconds) + " s"
                : seconds + " s";
              addRow("Shutter speed", shutter);
            }

            const focal = rationalValue(get("FocalLength"));
            if (focal != null) addRow("Focal length", focal + " mm");

            addRow("Date taken", get("DateTimeOriginal"));
            addRow("Exposure compensation", get("ExposureBias"));

            if (details.children.length === 1) {
              addRow("Metadata", "No EXIF camera data found");
            }
          });
        } catch (error) {
          if (id === requestId) addRow("Metadata", "Could not read EXIF data");
        }
      }

      function openPhoto(index) {
        currentIndex = (index + links.length) % links.length;

        const link = links[currentIndex];
        const img = link.querySelector("img");
        const photoUrl = link.href;
        const id = ++requestId;

        title.textContent = img.alt || "Bird photograph";
        description.textContent = link.dataset.description || "";
        details.replaceChildren();

        viewerImage.alt = title.textContent;
        viewerImage.src = photoUrl;

        viewer.classList.add("is-open");
        viewer.setAttribute("aria-hidden", "false");
        document.body.classList.add("lightbox-open");

        const metadataImage = new Image();

        metadataImage.onload = function () {
          if (id === requestId) renderExif(metadataImage, id);
        };

        metadataImage.onerror = function () {
          if (id !== requestId) return;
          details.replaceChildren();
          addRow("Metadata", "Could not load image metadata");
        };

        metadataImage.src = photoUrl;
      }

      function closePhoto() {
        requestId++;
        viewer.classList.remove("is-open");
        viewer.setAttribute("aria-hidden", "true");
        viewerImage.src = "";
        document.body.classList.remove("lightbox-open");
      }

      links.forEach(function (link, index) {
        link.addEventListener("click", function (event) {
          event.preventDefault();
          openPhoto(index);
        });
      });

      document.getElementById("lightboxClose").addEventListener("click", closePhoto);
      document.getElementById("lightboxPrev").addEventListener("click", function () {
        openPhoto(currentIndex - 1);
      });
      document.getElementById("lightboxNext").addEventListener("click", function () {
        openPhoto(currentIndex + 1);
      });

      viewer.addEventListener("click", function (event) {
        if (event.target === viewer) closePhoto();
      });

      document.addEventListener("keydown", function (event) {
        if (!viewer.classList.contains("is-open")) return;

        if (event.key === "Escape") closePhoto();
        if (event.key === "ArrowLeft") openPhoto(currentIndex - 1);
        if (event.key === "ArrowRight") openPhoto(currentIndex + 1);
      });
    });
  </script>
