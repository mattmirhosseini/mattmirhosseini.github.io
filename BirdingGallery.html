<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Birding Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #fff;
            color: #333;
        }

        a { text-decoration: none; }

        /* Header */
        .site-header {
            text-align: center;
            padding: 45px 20px 25px;
        }

        .site-header h1 {
            margin: 0 0 12px;
            font-size: 32px;
            font-weight: 500;
        }

        .site-header p {
            margin: 0;
            color: #777;
            font-size: 16px;
            font-weight: 300;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }

        .back-link:hover { color: #000; }

        /* Gallery */
        .gallery-container {
            width: min(1200px, 94%);
            margin: 0 auto 50px;
        }

        .gallery-heading {
            text-align: center;
            margin: 15px 0 30px;
            font-size: 24px;
            font-weight: 400;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 30px 24px;
        }

        .photo-card {
            min-width: 0;
            margin: 0;
            text-align: center;
        }

        .photo-link {
            display: block;
            width: 100%;
            overflow: hidden;
            background: #f4f4f4;
            cursor: zoom-in;
        }

        .photo-link img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .photo-link:hover img { transform: scale(1.035); }

        /* Centered captions */
        .photo-caption {
            display: block;
            width: 100%;
            padding: 12px 5px 0;
            margin: 0;
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
            color: #555;
        }

        /* Pagination */
        .pagination-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: 40px 0 20px;
        }

        .pagination-info {
            color: #777;
            font-size: 14px;
            text-align: center;
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .pagination button {
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            color: #444;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .pagination button:hover:not(:disabled) { background: #eee; }

        .pagination button.active {
            background: #333;
            border-color: #333;
            color: #fff;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Fullscreen lightbox */
        #photoLightbox.photo-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            width: 100%;
            height: 100%;
            padding: 25px;
            background: rgba(0, 0, 0, 0.96);
            align-items: center;
            justify-content: center;
        }

        #photoLightbox.photo-lightbox.open { display: flex; }

        .lightbox-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
            height: 100%;
            max-width: 1500px;
            position: relative;
        }

        .lightbox-image-container {
            display: flex;
            flex: 1 1 auto;
            min-width: 0;
            height: 100%;
            align-items: center;
            justify-content: center;
        }

        #lightboxImage {
            display: block;
            max-width: 100%;
            max-height: 92vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .photo-info {
            flex: 0 0 260px;
            max-height: 85vh;
            overflow-y: auto;
            color: #fff;
            padding: 10px;
        }

        .photo-info h2 {
            margin: 0 0 10px;
            font-size: 20px;
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .photo-info p {
            margin: 0 0 25px;
            color: #bbb;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .photo-info h3 {
            margin: 0 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
            font-size: 16px;
            font-weight: 500;
        }

        #exifDetails {
            margin: 0;
            padding: 0;
        }

        #exifDetails > div { margin-bottom: 13px; }

        #exifDetails dt {
            margin-bottom: 3px;
            color: #aaa;
            font-size: 12px;
            font-weight: 400;
        }

        #exifDetails dd {
            margin: 0;
            color: #fff;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .lightbox-close,
        .lightbox-prev,
        .lightbox-next {
            position: absolute;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: #fff;
            background: rgba(40, 40, 40, 0.7);
            cursor: pointer;
            transition: background 0.2s;
        }

        .lightbox-close:hover,
        .lightbox-prev:hover,
        .lightbox-next:hover {
            background: rgba(100, 100, 100, 0.8);
        }

        .lightbox-close {
            top: 15px;
            right: 15px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 28px;
        }

        .lightbox-prev,
        .lightbox-next {
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 60px;
            border-radius: 4px;
            font-size: 28px;
        }

        .lightbox-prev { left: 10px; }
        .lightbox-next { right: 10px; }

        /* Footer */
        .site-footer {
            padding: 25px 15px;
            text-align: center;
            border-top: 1px solid #eee;
            color: #888;
            font-size: 13px;
        }

        .site-footer a { color: #555; }

        /* Tablet */
        @media (max-width: 900px) {
            .photo-gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 25px 18px;
            }

            .photo-link img { height: 240px; }
            .lightbox-content { gap: 15px; }
            .photo-info { flex-basis: 220px; }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .site-header { padding-top: 30px; }
            .site-header h1 { font-size: 26px; }

            .gallery-container { width: 92%; }

            .photo-gallery {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .photo-link img {
                height: auto;
                max-height: 400px;
                object-fit: contain;
            }

            #photoLightbox.photo-lightbox {
                padding: 55px 12px 15px;
                overflow-y: auto;
                align-items: flex-start;
            }

            .lightbox-content {
                height: auto;
                min-height: 100%;
                flex-direction: column;
                gap: 15px;
                padding-bottom: 20px;
            }

            .lightbox-image-container {
                flex: 0 0 auto;
                width: 100%;
                min-height: 35vh;
                height: auto;
            }

            #lightboxImage {
                max-width: 100%;
                max-height: 55vh;
            }

            .photo-info {
                flex: 0 0 auto;
                width: 100%;
                max-height: none;
                padding: 10px 15px;
            }

            .lightbox-prev,
            .lightbox-next {
                position: fixed;
                top: 28vh;
                width: 38px;
                height: 50px;
            }

            .lightbox-prev { left: 5px; }
            .lightbox-next { right: 5px; }

            .lightbox-close {
                position: fixed;
                top: 8px;
                right: 8px;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <h1>My Birding Photo Collection</h1>
        <p>A collection of my bird photography.</p>
        <a class="back-link" href="index.html">
            <i class="fa fa-arrow-left" aria-hidden="true"></i>
            Back to Home
        </a>
    </header>

    <main class="gallery-container">
        <h2 class="gallery-heading">Birding</h2>

        <section class="photo-gallery" aria-label="Bird photography gallery">
            <!-- Photo cards are generated in descending order by JavaScript -->
        </section>

        <nav class="pagination-wrapper" aria-label="Gallery pagination">
            <div id="paginationInfo" class="pagination-info" aria-live="polite"></div>
            <div id="paginationControls" class="pagination"></div>
        </nav>
    </main>

    <!-- Fullscreen image viewer -->
    <div id="photoLightbox"
         class="photo-lightbox"
         role="dialog"
         aria-modal="true"
         aria-label="Bird photograph viewer"
         aria-hidden="true">

        <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close viewer">&times;</button>
        <button type="button" class="lightbox-prev" id="lightboxPrev" aria-label="Previous photograph">&#10094;</button>
        <button type="button" class="lightbox-next" id="lightboxNext" aria-label="Next photograph">&#10095;</button>

        <div class="lightbox-content">
            <div class="lightbox-image-container">
                <img id="lightboxImage" src="" alt="">
            </div>

            <aside class="photo-info">
                <h2 id="lightboxTitle">Bird photograph</h2>
                <p id="lightboxDescription"></p>
                <h3>Photo information</h3>
                <dl id="exifDetails"></dl>
            </aside>
        </div>
    </div>

    <footer class="site-footer">
        <p>
            &copy; <span id="currentYear"></span>
            Matt Mirhosseini. All rights reserved.
        </p>
        <p><a href="index.html">Home</a></p>
    </footer>

    <!-- EXIF library -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const gallery = document.querySelector(".photo-gallery");
            const viewer = document.getElementById("photoLightbox");
            const viewerImage = document.getElementById("lightboxImage");
            const title = document.getElementById("lightboxTitle");
            const description = document.getElementById("lightboxDescription");
            const details = document.getElementById("exifDetails");
            const closeButton = document.getElementById("lightboxClose");
            const prevButton = document.getElementById("lightboxPrev");
            const nextButton = document.getElementById("lightboxNext");
            const paginationInfo = document.getElementById("paginationInfo");
            const paginationControls = document.getElementById("paginationControls");

            const photosPerPage = 9;

            // Generate cards in descending order: birding28.jpg to birding1.jpg.
            for (let number = 28; number >= 1; number--) {
                const filenameNumber = number < 10
                    ? "0" + number
                    : String(number);

                const filename = "birding" + filenameNumber + ".jpg";

                const figure = document.createElement("figure");
                figure.className = "photo-card";

                const link = document.createElement("a");
                link.href = "images/" + filename;
                link.className = "photo-link";
                link.dataset.description = "Birding photograph " + number;

                const img = document.createElement("img");
                img.src = "images/" + filename;
                img.alt = "Birding photo " + number;
                img.loading = "lazy";

                const caption = document.createElement("figcaption");
                caption.className = "photo-caption";
                caption.textContent = "birding" + number;

                link.appendChild(img);
                figure.appendChild(link);
                figure.appendChild(caption);
                gallery.appendChild(figure);
            }

            const cards = Array.from(gallery.querySelectorAll(".photo-card"));
            const links = Array.from(gallery.querySelectorAll(".photo-link"));
            const totalPhotos = cards.length;
            const totalPages = Math.ceil(totalPhotos / photosPerPage);

            let currentPage = 1;
            let currentIndex = 0;
            let requestId = 0;

            document.getElementById("currentYear").textContent =
                new Date().getFullYear();

            /*
             * Pagination
             */
            function showPage(page, scrollToGallery = true) {
                currentPage = Math.max(1, Math.min(page, totalPages));

                const startIndex = (currentPage - 1) * photosPerPage;
                const endIndex = Math.min(startIndex + photosPerPage, totalPhotos);

                cards.forEach(function (card, index) {
                    card.hidden = index < startIndex || index >= endIndex;
                });

                paginationInfo.textContent =
                    "Showing " + (startIndex + 1) + "–" +
                    endIndex + " of " + totalPhotos + " photos";

                renderPagination();

                if (scrollToGallery) {
                    gallery.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                }
            }

            function renderPagination() {
                paginationControls.replaceChildren();

                const previousButton = document.createElement("button");
                previousButton.type = "button";
                previousButton.textContent = "Previous";
                previousButton.disabled = currentPage === 1;
                previousButton.setAttribute("aria-label", "Previous page");

                previousButton.addEventListener("click", function () {
                    if (currentPage > 1) showPage(currentPage - 1);
                });

                paginationControls.appendChild(previousButton);

                for (let page = 1; page <= totalPages; page++) {
                    const pageButton = document.createElement("button");
                    pageButton.type = "button";
                    pageButton.textContent = page;

                    if (page === currentPage) {
                        pageButton.classList.add("active");
                        pageButton.setAttribute("aria-current", "page");
                    }

                    pageButton.setAttribute("aria-label", "Page " + page);
                    pageButton.addEventListener("click", function () {
                        showPage(page);
                    });

                    paginationControls.appendChild(pageButton);
                }

                const nextButton = document.createElement("button");
                nextButton.type = "button";
                nextButton.textContent = "Next";
                nextButton.disabled = currentPage === totalPages;
                nextButton.setAttribute("aria-label", "Next page");

                nextButton.addEventListener("click", function () {
                    if (currentPage < totalPages) showPage(currentPage + 1);
                });

                paginationControls.appendChild(nextButton);
            }

            /*
             * EXIF helpers — same method as the working Nature gallery.
             */
            function addRow(label, value) {
                if (value === undefined || value === null || value === "") {
                    return;
                }

                const row = document.createElement("div");
                const term = document.createElement("dt");
                const valueElement = document.createElement("dd");

                term.textContent = label;
                valueElement.textContent = String(value);

                row.appendChild(term);
                row.appendChild(valueElement);
                details.appendChild(row);
            }

            function formatExposureTime(value) {
                const seconds = Number(value);

                if (!Number.isFinite(seconds) || seconds <= 0) {
                    return value;
                }

                if (seconds < 1) {
                    const denominator = Math.round(1 / seconds);
                    if (denominator > 0) return "1/" + denominator + " s";
                }

                return seconds + " s";
            }

            function formatFocalLength(value) {
                if (value && typeof value === "object" && "numerator" in value) {
                    const denominator = Number(value.denominator) || 1;
                    return (Number(value.numerator) / denominator) + " mm";
                }

                return value + " mm";
            }

            function renderExif(image, id) {
                if (id !== requestId) return;

                details.replaceChildren();

                addRow(
                    "Dimensions",
                    image.naturalWidth + " × " + image.naturalHeight + " px"
                );

                if (typeof EXIF === "undefined") {
                    addRow("Metadata", "EXIF library could not be loaded.");
                    return;
                }

                try {
                    EXIF.getData(image, function () {
                        if (id !== requestId) return;

                        function getTag(tag) {
                            return EXIF.getTag(this, tag);
                        }

                        const camera = getTag.call(this, "Model");
                        const lens = getTag.call(this, "LensModel");
                        const iso = getTag.call(this, "ISOSpeedRatings");
                        const aperture = getTag.call(this, "FNumber");
                        const exposure = getTag.call(this, "ExposureTime");
                        const focalLength = getTag.call(this, "FocalLength");
                        const dateTaken = getTag.call(this, "DateTimeOriginal");
                        const exposureBias = getTag.call(this, "ExposureBias");

                        addRow("Camera", camera);
                        addRow("Lens", lens);
                        addRow("ISO", Array.isArray(iso) ? iso.join(", ") : iso);

                        if (aperture !== undefined && aperture !== null) {
                            addRow("Aperture", "f/" + aperture);
                        }

                        if (exposure !== undefined && exposure !== null) {
                            addRow("Shutter speed", formatExposureTime(exposure));
                        }

                        if (focalLength !== undefined && focalLength !== null) {
                            addRow("Focal length", formatFocalLength(focalLength));
                        }

                        addRow("Date taken", dateTaken);
                        addRow("Exposure compensation", exposureBias);

                        if (details.children.length === 1) {
                            addRow("Metadata", "No additional EXIF camera data found.");
                        }
                    });
                } catch (error) {
                    if (id === requestId) {
                        addRow("Metadata", "Could not read EXIF data.");
                    }
                }
            }

            /*
             * Open a photograph and read its EXIF data using a separate Image.
             */
            function openPhoto(index) {
                if (!links.length) return;

                currentIndex = (index + links.length) % links.length;

                const link = links[currentIndex];
                const thumbnail = link.querySelector("img");
                const photoUrl = link.href;
                const id = ++requestId;

                title.textContent = thumbnail.alt || "Bird photograph";
                description.textContent = link.dataset.description || "";

                details.replaceChildren();
                addRow("Metadata", "Loading camera information…");

                viewer.classList.add("open");
                viewer.setAttribute("aria-hidden", "false");
                document.body.style.overflow = "hidden";

                viewerImage.onload = function () {
                    if (id !== requestId) return;
                    viewerImage.alt = thumbnail.alt || "Bird photograph";
                };

                viewerImage.onerror = function () {
                    if (id !== requestId) return;
                    details.replaceChildren();
                    addRow("Metadata", "Could not load this photograph.");
                };

                viewerImage.src = photoUrl;
                viewerImage.alt = thumbnail.alt || "Bird photograph";

                // Separate Image object for EXIF reading, as in Nature gallery.
                const metadataImage = new Image();

                metadataImage.onload = function () {
                    if (id !== requestId) return;
                    renderExif(metadataImage, id);
                };

                metadataImage.onerror = function () {
                    if (id !== requestId) return;
                    details.replaceChildren();
                    addRow("Metadata", "Could not read this image.");
                };

                metadataImage.src = photoUrl;
            }

            function closePhoto() {
                requestId++;

                viewer.classList.remove("open");
                viewer.setAttribute("aria-hidden", "true");
                document.body.style.overflow = "";

                viewerImage.removeAttribute("src");
            }

            /*
             * Gallery click handlers
             */
            links.forEach(function (link, index) {
                link.addEventListener("click", function (event) {
                    event.preventDefault();
                    openPhoto(index);
                });
            });

            closeButton.addEventListener("click", closePhoto);

            prevButton.addEventListener("click", function () {
                openPhoto(currentIndex - 1);
            });

            nextButton.addEventListener("click", function () {
                openPhoto(currentIndex + 1);
            });

            viewer.addEventListener("click", function (event) {
                if (event.target === viewer) closePhoto();
            });

            document.addEventListener("keydown", function (event) {
                if (!viewer.classList.contains("open")) return;

                if (event.key === "Escape") {
                    closePhoto();
                } else if (event.key === "ArrowLeft") {
                    openPhoto(currentIndex - 1);
                } else if (event.key === "ArrowRight") {
                    openPhoto(currentIndex + 1);
                }
            });

            // Start on page 1.
            showPage(1, false);
        });
    </script>
</body>
</html>
